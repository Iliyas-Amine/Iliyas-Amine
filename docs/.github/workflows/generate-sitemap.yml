name: Auto Update Sitemap & Articles Catalog

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'articles/**'

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Sitemap Generator Script
        run: node scripts/generate-sitemap.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml script.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update sitemap.xml and article catalog [skip ci]" && git push)
